syntax = "proto3";

package internal;

option go_package = "internal/proto";

message Metric {
    string ID = 1;
    string MType = 2;
    int64 Delta = 3;
    double Value = 4;
}

message Batch {
    repeated Metric metrics = 1;
}

message AddMetricsRequest {
    Batch metrics = 1;
}

message AddMetricsResponse {
    string error = 1;
}

message GetMetricRequest {
    Metric metric = 1;
}

message GetMetricResponse {
    string error = 1;
}

message GetAllMetricsRequest {
    Batch metrics = 1;
}

message GetAllMetricsResponse {
    string error = 1;
}

service MetricService {
  rpc SetMultiParamGRPC(AddMetricsRequest) returns (AddMetricsResponse);
  rpc GetParamGRPC(GetMetricRequest) returns (GetMetricResponse);
  rpc GetAllParamsGRPC(GetAllMetricsRequest) returns (GetAllMetricsResponse);
}
